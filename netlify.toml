[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_URL = "https://obras-987880634361.us-central1.run.app"

[[redirects]]
  from   = "/api/*"
  to     = "https://obras-987880634361.us-central1.run.app/api/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/auth/*"
  to     = "https://obras-987880634361.us-central1.run.app/auth/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
