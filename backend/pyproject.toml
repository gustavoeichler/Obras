[project]
name = "obras-backend"
version = "0.1.0"
description = "Reforma SaaS — Flask REST API"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-cors>=5.0.0",
    "marshmallow>=3.23.0",
    "flask-jwt-extended>=4.7.1",
    "psycopg2-binary>=2.9.0",
    "itsdangerous>=2.1.0",
    "weasyprint>=62.0; platform_system != 'Windows'",
    "supabase>=2.0.0",
]

[tool.setuptools]
packages = ["app"]
