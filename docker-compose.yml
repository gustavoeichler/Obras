version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: reforma
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres.udcxcawdkqfcitizunnc:!Vascoda4262!@aws-1-us-east-1.pooler.supabase.com:5432/postgres
      JWT_SECRET_KEY: dev-secret-change-in-prod
      FLASK_APP: run.py
    command: sh -c "pip install -e . && flask db upgrade && python run.py"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://backend:5000

volumes:
  db_data: